<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cosmic Typing Quest</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="game-wrap">
    <!-- 3D background layer (Three.js): rotating NASA-textured planets + starfield -->
    <canvas id="bg3d"></canvas>
    <!-- 2D gameplay + HUD layer, transparent so the 3D layer shows through -->
    <canvas id="game"></canvas>

    <!-- HTML overlay used for the menu screens (keyboard + click friendly) -->
    <div id="ui"></div>

    <div id="rotate-hint">Please rotate your device to landscape 🚀</div>

    <!-- shows which renderer is active: WebGPU / WebGL2 / 2D -->
    <div id="gpu-badge">2D</div>
  </div>

  <!-- Scripts load in order; everything hangs off the global CTQ namespace.
       ?v= cache-busts so updates aren't served stale. -->
  <script src="js/data.js?v=8"></script>
  <script src="js/audio.js?v=8"></script>
  <script src="js/engine.js?v=8"></script>
  <script src="js/sprites.js?v=8"></script>
  <script src="js/menus.js?v=8"></script>
  <script src="js/games.js?v=8"></script>
  <script src="js/main.js?v=8"></script>

  <!-- 3D layer: modern Three.js on the WebGPU renderer (auto-falls back to WebGL2).
       ES module, loads after the classic scripts and self-initializes. -->
  <script type="importmap">
    { "imports": { "three": "./js/vendor/three-wgpu/three.webgpu.min.js" } }
  </script>
  <script type="module" src="js/three3d.js?v=8"></script>
</body>
</html>
