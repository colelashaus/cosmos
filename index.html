<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cosmic Typing Quest</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="game-wrap">
    <!-- 3D background layer (Three.js): rotating NASA-textured planets + starfield -->
    <canvas id="bg3d"></canvas>
    <!-- 2D gameplay + HUD layer, transparent so the 3D layer shows through -->
    <canvas id="game"></canvas>

    <!-- HTML overlay used for the menu screens (keyboard + click friendly) -->
    <div id="ui"></div>

    <div id="rotate-hint">Please rotate your device to landscape 🚀</div>
  </div>

  <!-- Scripts load in order; everything hangs off the global CTQ namespace -->
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/vendor/three.min.js"></script>
  <script src="js/three3d.js"></script>
  <script src="js/menus.js"></script>
  <script src="js/games.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
