# Render.com deployment config — static site (no server, free tier).
# Render auto-detects this file when you create a "Blueprint" from the repo.
services:
  - type: web
    name: cosmic-typing-quest
    runtime: static
    # No build step needed — the site is plain HTML/CSS/JS.
    buildCommand: ""
    staticPublishPath: .
    # Revalidate on every load so redeploys are never served stale. Unchanged
    # files (e.g. large textures) still return a fast 304 Not Modified.
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
